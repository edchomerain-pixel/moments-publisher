name: MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run format:check
      - run: npm test
      - run: npm run test:inbox-worker
      - run: node --test scripts/check-live-pages.test.cjs
      - run: npm run test:worker-runtime
      - run: npm run build
      - run: npm run check:release
      - name: Use official Ubuntu mirrors for browser dependencies
        run: |
          for mirror in /etc/apt/apt-mirrors*.txt; do
            if [ -f "$mirror" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$mirror"
            fi
          done
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Verify published Pages and Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-live-pages.cjs dist

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-details
          path: test-results/
          retention-days: 7
